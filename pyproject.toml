[project]
name = "pythonproject9"
version = "0.1.0"
description = "Django Habit-tracker"
authors = [
    {name = "Max",email = "z.max83@mail.ru"}
]
readme = "README.md"
packages = [{include = "config"}, {include = "users"}, {include = "habits"}, {include = "telegram_bot"}]
[tool.poetry.dependencies]
    python = ">=3.13,<4.0"
    requests = ">=2.32.5,<3.0.0"
    django = ">=5.2.7,<6.0.0"
    psycopg2 = ">=2.9.10,<3.0.0"
    djangorestframework = ">=3.16.1,<4.0.0"
    drf-yasg = ">=1.21.11,<2.0.0"
    celery = ">=5.5.3,<6.0.0"
    dotenv = ">=0.9.9,<0.10.0"
    djangorestframework-simplejwt = ">=5.5.1,<6.0.0"
    django-phonenumber-field = ">=8.3.0,<9.0.0"
    django-filter = ">=25.2,<26.0"
    redis = ">=6.4.0,<7.0.0"
    django-celery-beat = ">=2.8.1,<3.0.0"
    django-cors-headers = ">=4.9.0,<5.0.0"
    isort = ">=7.0.0,<8.0.0"
    python-telegram-bot = ">=22.5,<23.0"
    coverage = ">=7.10.7,<8.0.0"
    python-dotenv = ">=1.2.1,<2.0.0"
    psycopg2-binary = ">=2.9.11,<3.0.0"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.9.0"
mypy = "^1.18.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[tool.black]
line-length = 119
exclude = '.git'

[tool.mypy]
line-length = 119
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv', 'tests']

[tool.isort]
line_length = 119
